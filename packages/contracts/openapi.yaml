openapi: 3.1.0
info:
  title: Bio Token Auth — Modes A/B/C
  version: 0.2.0
  description: >-
    Same-origin HTTPS browser API and separate native proof API. Browser mutations require the exact configured Origin, JSON and the indicated cookie. Native
    /api/mobile operations accept no browser cookies and authenticate using purpose-bound, one-use cryptographic device proofs. All API responses are no-store.
    B requires configured trusted YubiKey attestation; C additionally requires an explicit physical hardware release gate and trusted Android key attestation.
    Disabled modes return 503. Never log passwords, OTP, cookies, QR capabilities, signing inputs, private keys or biometric data.
servers:
  - url: /
components:
  securitySchemes:
    pending:
      type: apiKey
      in: cookie
      name: __Host-bio_pending
    session:
      type: apiKey
      in: cookie
      name: __Host-bio_session
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        statusCode:
          type: integer
    UserSession:
      type: object
      required:
        - username
        - mode
        - totpActive
        - expiresAt
      properties:
        username:
          type: string
        mode:
          type: string
          enum:
            - A
            - B
            - C
        totpActive:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        authTime:
          type: string
          format: date-time
        factors:
          type: array
          items:
            type: string
            enum:
              - password
              - totp
              - webauthn
              - mobile
        allowedModes:
          type: array
          items:
            type: string
            enum:
              - A
              - B
              - C
    Opaque:
      type: string
      pattern: ^[A-Za-z0-9_-]{43}$
      description: Secret random capability. Never log or persist outside protected application state.
    WebAuthnRegistration:
      type: object
      required:
        - id
        - rawId
        - type
        - response
        - clientExtensionResults
      properties:
        id:
          type: string
          maxLength: 2048
        rawId:
          type: string
          maxLength: 2048
        type:
          type: string
          const: public-key
        response:
          type: object
          required:
            - clientDataJSON
            - attestationObject
          properties:
            clientDataJSON:
              type: string
              maxLength: 49152
            attestationObject:
              type: string
              maxLength: 49152
            transports:
              type: array
              items:
                type: string
        clientExtensionResults:
          type: object
        authenticatorAttachment:
          type: string
    WebAuthnAssertion:
      type: object
      required:
        - id
        - rawId
        - type
        - response
        - clientExtensionResults
      properties:
        id:
          type: string
          maxLength: 2048
        rawId:
          type: string
          maxLength: 2048
        type:
          type: string
          const: public-key
        response:
          type: object
          required:
            - clientDataJSON
            - authenticatorData
            - signature
          properties:
            clientDataJSON:
              type: string
              maxLength: 4096
            authenticatorData:
              type: string
              maxLength: 4096
            signature:
              type: string
              maxLength: 4096
            userHandle:
              type:
                - string
                - 'null'
              maxLength: 128
        clientExtensionResults:
          type: object
        authenticatorAttachment:
          type: string
    CredentialDescriptor:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
        type:
          type: string
          const: public-key
        transports:
          type: array
          items:
            type: string
    AuthenticationOptions:
      type: object
      required:
        - challenge
        - rpId
        - userVerification
        - timeout
      properties:
        challenge:
          type: string
        rpId:
          type: string
        userVerification:
          type: string
          const: required
        timeout:
          type: integer
        allowCredentials:
          type: array
          items:
            $ref: '#/components/schemas/CredentialDescriptor'
      description: WebAuthn JSON for navigator.credentials.get; C has no allowCredentials.
    RegistrationOptions:
      type: object
      required:
        - challenge
        - rp
        - user
        - pubKeyCredParams
        - authenticatorSelection
      properties:
        challenge:
          type: string
        rp:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        user:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            displayName:
              type: string
        pubKeyCredParams:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                const: public-key
              alg:
                type: integer
        authenticatorSelection:
          type: object
          properties:
            residentKey:
              type: string
              enum:
                - discouraged
                - required
            userVerification:
              type: string
              const: required
            authenticatorAttachment:
              type: string
              const: cross-platform
        attestation:
          type: string
          const: direct
        excludeCredentials:
          type: array
          items:
            $ref: '#/components/schemas/CredentialDescriptor'
        timeout:
          type: integer
        extensions:
          type: object
    RegistrationOptionsResult:
      type: object
      required:
        - registrationId
        - options
        - expiresAt
      properties:
        registrationId:
          type: string
          format: uuid
        options:
          $ref: '#/components/schemas/RegistrationOptions'
        expiresAt:
          type: string
          format: date-time
    AuthenticationOptionsResult:
      type: object
      required:
        - options
        - expiresAt
      properties:
        options:
          $ref: '#/components/schemas/AuthenticationOptions'
        expiresAt:
          type: string
          format: date-time
        proofId:
          type: string
          format: uuid
    GrantRequest:
      type: object
      required:
        - scope
      properties:
        scope:
          type: string
          enum:
            - ENROLL
            - REVOKE
            - POLICY
        password:
          type: string
          minLength: 1
          maxLength: 128
        code:
          type: string
          pattern: ^[0-9]{6}$
      description: Recent full authentication suffices. Stale A may reauthenticate with password plus active TOTP. B/C require a new full login when stale.
    GrantResult:
      type: object
      required:
        - grant
        - scope
        - expiresAt
      properties:
        grant:
          $ref: '#/components/schemas/Opaque'
        scope:
          type: string
          enum:
            - ENROLL
            - REVOKE
            - POLICY
        expiresAt:
          type: string
          format: date-time
    GrantOnly:
      type: object
      required:
        - grant
      properties:
        grant:
          $ref: '#/components/schemas/Opaque'
    ProofRequest:
      type: object
      required:
        - proofId
        - response
      properties:
        proofId:
          type: string
          format: uuid
        response:
          $ref: '#/components/schemas/WebAuthnAssertion'
    AssertionRequest:
      type: object
      required:
        - response
      properties:
        response:
          $ref: '#/components/schemas/WebAuthnAssertion'
    CredentialState:
      type: object
      required:
        - credentialId
        - state
      properties:
        credentialId:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - CANDIDATE
            - ACTIVE
    CStatus:
      type: object
      required:
        - state
        - expiresAt
      properties:
        state:
          type: string
          enum:
            - PENDING_YUBIKEY
            - PENDING_MOBILE
            - APPROVED
            - REJECTED
            - CONSUMED
            - VERIFIED_C
            - EXPIRED
            - CANCELLED
        expiresAt:
          type: string
          format: date-time
    MobilePending:
      type: object
      required:
        - state
        - transactionId
        - capability
        - expiresAt
      properties:
        state:
          type: string
          const: PENDING_MOBILE
        transactionId:
          type: string
          format: uuid
        capability:
          $ref: '#/components/schemas/Opaque'
        expiresAt:
          type: string
          format: date-time
      description: QR JSON is {v:1,type:"login",token:capability,origin:trusted APP_ORIGIN}. Capability cannot poll, complete or obtain a web session.
    MobilePublicJwk:
      type: object
      additionalProperties: false
      required:
        - kty
        - crv
        - x
        - 'y'
      properties:
        kty:
          type: string
          const: EC
        crv:
          type: string
          const: P-256
        x:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        'y':
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
    CertificateChain:
      type: array
      minItems: 2
      maxItems: 8
      items:
        type: string
        maxLength: 16384
        description: Base64 DER certificate
    NativeChallenge:
      type: object
      required:
        - challengeId
        - signingInput
        - expiresAt
      properties:
        challengeId:
          type: string
          format: uuid
        signingInput:
          type: string
          description: Exact protected-header.payload JWS bytes. Do not reserialize JSON.
        expiresAt:
          type: string
          format: date-time
    NativeProof:
      type: object
      additionalProperties: false
      required:
        - challengeId
        - proofJws
      properties:
        challengeId:
          type: string
          format: uuid
        proofJws:
          type: string
          maxLength: 16384
          description: ES256 compact JWS using paired device-auth key
    Device:
      type: object
      required:
        - id
        - label
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        status:
          type: string
          enum:
            - CANDIDATE
            - AWAITING_PC_CONFIRMATION
            - ACTIVE
            - REVOKED
        createdAt:
          type: string
          format: date-time
  responses:
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Invalid credentials, disallowed mode, missing/expired/consumed transaction, replay or missing/expired session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Missing/wrong Origin or unsupported Content-Type
    Limited:
      description: Five-minute attempt limit reached
    Unavailable:
      description: Mode disabled or trusted attestation/physical hardware release gate not configured
paths:
  /api/health:
    get:
      operationId: health
      responses:
        '200':
          description: API started and database connected at startup
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                  modes:
                    type: array
                    items:
                      type: string
                      enum:
                        - A
                        - B
                        - C
  /api/auth/register:
    post:
      operationId: register
      description: >-
        Creates a unique account with an 8–128-character password, issues a Secure/HttpOnly/SameSite=Strict eight-hour session, and leaves TOTP optional until
        activated from that session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  pattern: ^[a-z0-9][a-z0-9._-]{2,63}$
                  maxLength: 64
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        '201':
          description: Account created and signed in
          headers:
            Set-Cookie:
              schema:
                type: string
              description: __Host-bio_session; Secure; HttpOnly; SameSite=Strict; Path=/; Expires=...
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Username is unavailable
        '429':
          $ref: '#/components/responses/Limited'
  /api/auth/password:
    post:
      operationId: verifyPassword
      description: >-
        Verifies password and backend policy. If TOTP is active, issues a five-minute pending cookie; otherwise, issues an eight-hour session. Replaces the
        calling browser's old pending transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  pattern: ^[a-z0-9][a-z0-9._-]{2,63}$
                  maxLength: 64
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        '201':
          description: Pending authentication created
          headers:
            Set-Cookie:
              schema:
                type: string
              description: __Host-bio_pending; Secure; HttpOnly; SameSite=Strict; Path=/; Expires=...
          content:
            application/json:
              schema:
                type: object
                required:
                  - step
                  - expiresAt
                properties:
                  step:
                    type: string
                    enum:
                      - done
                      - totp
                  expiresAt:
                    type: string
                    format: date-time
                  user:
                    $ref: '#/components/schemas/UserSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/Limited'
  /api/auth/enrollment:
    get:
      operationId: getTotpSetup
      security:
        - session: []
      description: >-
        Returns setup material only to a signed-in account that has not enabled TOTP. Secret and QR must never be cached, logged, or sent to an external QR
        service.
      responses:
        '200':
          description: Initial enrollment material
          content:
            application/json:
              schema:
                type: object
                required:
                  - secret
                  - qr
                properties:
                  secret:
                    type: string
                    description: Base32 TOTP secret
                  qr:
                    type: string
                    description: Locally generated PNG data URL
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: TOTP is already active
  /api/auth/totp/activate:
    post:
      operationId: activateTotp
      security:
        - session: []
      description: Verifies the first six-digit TOTP code and activates the factor. The account row is locked to prevent replay during simultaneous setup requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  pattern: ^[0-9]{6}$
      responses:
        '201':
          description: TOTP is active
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: TOTP is already active
        '429':
          $ref: '#/components/responses/Limited'
  /api/auth/totp:
    post:
      operationId: completeModeA
      security:
        - pending: []
      description: >-
        SHA-1 / six digits / 30 seconds / ±30-second tolerance. At most five attempts per pending transaction and ten per account per five minutes. Atomically
        consumes pending, advances account timestep and creates an eight-hour session. TOTP must already be active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  pattern: ^[0-9]{6}$
      responses:
        '201':
          description: Authenticated; pending cookie cleared and session cookie issued
          headers:
            Set-Cookie:
              schema:
                type: string
              description: __Host-bio_session; Secure; HttpOnly; SameSite=Strict; Path=/; Expires=...
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/Limited'
  /api/auth/me:
    get:
      operationId: currentSession
      security:
        - session: []
      responses:
        '200':
          description: Active session whose actual factor evidence, active credentials, security version and account mode policy remain valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/logout:
    post:
      operationId: logout
      description: Idempotently revoke supplied pending and session cookies in the database and clear both cookies. Origin and JSON remain required even without cookies.
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/capabilities:
    get:
      operationId: authCapabilities
      summary: Configured server release gates; does not reveal account-specific modes
      security: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - modes
                  - webauthnEnabled
                  - modeCEnabled
                properties:
                  modes:
                    type: array
                    items:
                      type: string
                      enum:
                        - A
                        - B
                        - C
                  webauthnEnabled:
                    type: boolean
                  modeCEnabled:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conflict, consumed proof or unavailable prerequisite
        '429':
          $ref: '#/components/responses/Limited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/account/reauth:
    post:
      operationId: reauthenticate
      summary: Issue one-use, five-minute action grant bound to current full fresh session
      security:
        - session: []
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conflict, consumed proof or unavailable prerequisite
        '429':
          $ref: '#/components/responses/Limited'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantRequest'
  /api/account/webauthn:
    get:
      operationId: listCredentials
      summary: List only this account credentials
      security:
        - session: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - credentials
                properties:
                  credentials:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - id
                        - profile
                        - state
                        - createdAt
                        - proofAt
                      properties:
                        id:
                          type: string
                          format: uuid
                        profile:
                          type: string
                          enum:
                            - B
                            - C
                        state:
                          type: string
                          enum:
                            - CANDIDATE
                            - ACTIVE
                            - REVOKED
                        createdAt:
                          type: string
                          format: date-time
                        proofAt:
                          type:
                            - string
                            - 'null'
                          format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conflict, consumed proof or unavailable prerequisite
        '429':
          $ref: '#/components/responses/Limited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/account/webauthn/registrations/options:
    post:
      operationId: credentialRegistrationOptions
      summary: Consume ENROLL grant; create purpose/account/session-bound registration
      security:
        - session: []
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationOptionsResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conflict, consumed proof or unavailable prerequisite
        '429':
          $ref: '#/components/responses/Limited'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - profile
                - grant
              properties:
                profile:
                  type: string
                  enum:
                    - B
                    - C
                grant:
                  $ref: '#/components/schemas/Opaque'
  /api/account/webauthn/registrations/verify:
    post:
      operationId: credentialRegistrationVerify
      summary: Verify UP/UV and trusted YubiKey packed attestation; store candidate only
      security:
        - session: []
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conflict, consumed proof or unavailable prerequisite
        '429':
          $ref: '#/components/responses/Limited'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - registrationId
                - response
              properties:
                registrationId:
                  type: string
                  format: uuid
                response:
                  $ref: '#/components/schemas/WebAuthnRegistration'
  /api/account/webauthn/activations/options:
    post:
      operationId: credentialActivationOptions
      summary: Fresh account session proves candidate credential possession before activation
      security:
        - session: []
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationOptionsResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conflict, consumed proof or unavailable prerequisite
        '429':
          $ref: '#/components/responses/Limited'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - credentialId
              properties:
                credentialId:
                  type: string
                  format: uuid
  /api/account/webauthn/activations/verify:
    post:
      operationId: credentialActivationVerify
      summary: One-use assertion activates candidate without issuing a login session or changing modes
      security:
        - session: []
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conflict, consumed proof or unavailable prerequisite
        '429':
          $ref: '#/components/responses/Limited'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofRequest'
  /api/account/webauthn/proofs/options:
    post:
      operationId: pairingYubiKeyOptions
      summary: Fresh session and active C credential authorize a pairing proof
      security:
        - session: []
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
