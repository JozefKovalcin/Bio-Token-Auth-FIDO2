                  format: uuid
                transactionToken:
                  $ref: '#/components/schemas/Opaque'
                operation:
                  type: string
                  enum:
                    - resolve
                    - reject
  /api/mobile/auth/resolve:
    post:
      operationId: resolveMobileLogin
      summary: >-
        Consume signed LOGIN_RESOLVE proof and return trusted account detail and exact approval signing input. Native endpoint: reject browser cookies; Origin
        is not authentication.
      security: []
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - transactionId
                  - username
                  - serviceOrigin
                  - expiresAt
                  - challengeId
                  - signingInput
                properties:
                  transactionId:
                    type: string
                    format: uuid
                  username:
                    type: string
                  serviceOrigin:
                    type: string
                    format: uri
                  expiresAt:
                    type: string
                    format: date-time
                  challengeId:
                    type: string
                    format: uuid
                  signingInput:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conflict, consumed proof or unavailable prerequisite
        '429':
          $ref: '#/components/responses/Limited'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeProof'
  /api/mobile/auth/approve:
    post:
      operationId: approveMobileLogin
      summary: >-
        Consume biometric approval-key ES256 JWS; transition only same-account transaction to APPROVED; never return web cookie. Native endpoint: reject browser
        cookies; Origin is not authentication.
      security: []
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: APPROVED
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conflict, consumed proof or unavailable prerequisite
        '429':
          $ref: '#/components/responses/Limited'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - challengeId
                - approvalJws
              properties:
                challengeId:
                  type: string
                  format: uuid
                approvalJws:
                  type: string
                  maxLength: 16384
  /api/mobile/auth/reject:
    post:
      operationId: rejectMobileLogin
