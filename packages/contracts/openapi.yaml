        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conflict, consumed proof or unavailable prerequisite
        '429':
          $ref: '#/components/responses/Limited'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeProof'
  /api/mobile/devices/challenge:
