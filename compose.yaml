name: bio-token-auth
services:
  db:
    image: postgres:18.4
    environment:
      POSTGRES_USER: bio_auth
      POSTGRES_DB: bio_auth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/Init-Lan.ps1 first}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U bio_auth -d bio_auth']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://bio_auth:${POSTGRES_PASSWORD}@db:5432/bio_auth
      APP_ORIGIN: https://${APP_HOST:?Run scripts/Init-Lan.ps1 first}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Run scripts/Init-Lan.ps1 first}
      WEBAUTHN_ENABLED: ${WEBAUTHN_ENABLED:-false}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_TRUSTED_ROOTS_FILE: ${WEBAUTHN_TRUSTED_ROOTS_FILE:-/config/webauthn-roots.json}
      WEBAUTHN_INTERMEDIATES_FILE: ${WEBAUTHN_INTERMEDIATES_FILE:-}
      WEBAUTHN_AAGUID_ALLOWLIST: ${WEBAUTHN_AAGUID_ALLOWLIST:-}
      MODE_C_ENABLED: ${MODE_C_ENABLED:-false}
      MODE_C_HARDWARE_VERIFIED: ${MODE_C_HARDWARE_VERIFIED:-false}
      ATTESTATION_SERVICE_URL: ${ATTESTATION_SERVICE_URL:-http://attestation:8081}
      ATTESTATION_SERVICE_TOKEN: ${ATTESTATION_SERVICE_TOKEN:-}
    volumes:
      - ./infra/data:/config:ro
    command: [sh, -c, 'pnpm db:deploy && node dist/api/main.js']
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12
    restart: unless-stopped
  caddy:
    build:
      context: .
      target: web
    environment:
      APP_HOST: ${APP_HOST}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  attestation:
    profiles: [mode-c]
    build:
      context: ./infra/attestation
    environment:
      ATTESTATION_SERVICE_TOKEN: ${ATTESTATION_SERVICE_TOKEN:-}
      ATTESTATION_PACKAGE_NAME: ${ATTESTATION_PACKAGE_NAME:-sk.biotoken.android}
      ATTESTATION_SIGNING_CERT_SHA256: ${ATTESTATION_SIGNING_CERT_SHA256:-}
      ATTESTATION_MIN_APP_VERSION: ${ATTESTATION_MIN_APP_VERSION:-1}
    restart: unless-stopped
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
